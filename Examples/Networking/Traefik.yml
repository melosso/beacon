### Production Example (Docker Compose with Traefik)

```yaml
services:
  beacon:
    image: ghcr.io/melosso/beacon:latest
    volumes:
      - beacon_data:/app/data    # Database storage
      - beacon_core:/app/.core   # Encryption keys
    environment:
      - SIGNING_KEY=${SIGNING_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - PEPPER=${PEPPER}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - CONNECTION_STRING=Data Source=/app/data/Beacon.db
      - API_HOSTS=beacon-api.example.com
      - ADMIN_HOSTS=beacon-admin.example.com
      - TRUST_FORWARDED_HEADERS=true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.beacon-api.rule=Host(`beacon-api.example.com`)"
      - "traefik.http.routers.beacon-admin.rule=Host(`beacon-admin.example.com`)"

volumes:
  beacon_data:
  beacon_core:
```
