<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Email Preferences</title>

  <meta name="color-scheme" content="light dark" />

  <style>
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --accent: #2563eb;

      --radius: 14px;
      --max-width: 520px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f0f;
        --fg: #e7e7e7;
        --accent: #7aa2ff;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: var(--max-width);
      border: 1px solid color-mix(in srgb, var(--fg) 15%, transparent);
      border-radius: var(--radius);
      padding: 28px;
    }

    h1 {
      font-size: 1.4rem;
      margin: 0 0 8px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    p {
      margin: 0 0 24px;
      color: color-mix(in srgb, var(--fg) 75%, transparent);
    }

    .preferences {
      margin-bottom: 24px;
    }

    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-top: 1px solid color-mix(in srgb, var(--fg) 10%, transparent);
    }

    .toggle:first-child {
      border-top: none;
    }

    .toggle label {
      font-size: 1rem;
      cursor: pointer;
    }

    .toggle input {
      appearance: none;
      width: 44px;
      height: 26px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--fg) 20%, transparent);
      position: relative;
      cursor: pointer;
    }

    .toggle input::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--bg);
      transition: transform 0.2s ease;
    }

    .toggle input:checked {
      background: var(--fg);
    }

    .toggle input:checked::after {
      transform: translateX(18px);
    }

    .toggle input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    button {
      appearance: none;
      border: none;
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      background: var(--fg);
      color: var(--bg);
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
    }

    button.secondary {
      margin-top: 12px;
      background: transparent;
      color: var(--fg);
      border: 1px solid color-mix(in srgb, var(--fg) 25%, transparent);
    }

    footer {
      margin-top: 24px;
      font-size: 0.85rem;
      text-align: center;
      color: color-mix(in srgb, var(--fg) 60%, transparent);
    }

    .email {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: color-mix(in srgb, var(--fg) 70%, transparent);
      word-break: break-all;
    }
  </style>
</head>

<body>
  <main>
    <section class="card">
      <h1>Email preferences</h1>
      <p>
        You're receiving these emails because you previously opted in.
        You can change that here.
      </p>

      <form method="post">
        <div class="preferences">
          <div class="toggle">
            <label for="newsletter">Newsletter</label>
            <input type="checkbox" id="newsletter" name="newsletter" checked />
          </div>

          <div class="toggle">
            <label for="system-updates">System updates</label>
            <input type="checkbox" id="system-updates" name="systemUpdates" checked />
          </div>
        </div>

        <button type="submit">
          Save preferences
        </button>

        <button type="button" class="secondary">
          Unsubscribe from all
        </button>
      </form>

      <footer>
        Preferences for:<br />
        <span class="email">
          <!-- injected using server-side JS -->
          user@example.com
        </span>
      </footer>
    </section>
  </main>
</body>
</html>
