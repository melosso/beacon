<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Email Preferences</title>
  <style type="text/css">
    body { margin: 0; padding: 0; }
    table { border-collapse: collapse; }
    
    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      .bg { background-color: #0f0f0f !important; }
      .card-bg { background-color: #0f0f0f !important; }
      .border { border-color: #262626 !important; }
      .title { color: #e7e7e7 !important; }
      .body-text { color: #bfbfbf !important; }
      .footer-text { color: #999999 !important; }
      .btn-primary { background-color: #e7e7e7 !important; color: #0f0f0f !important; }
      .btn-secondary { background-color: #0f0f0f !important; color: #e7e7e7 !important; border-color: #404040 !important; }
    }

    .select-none { user-select: none;}
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #ffffff;" class="bg">
  
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #ffffff;" class="bg">
    <tr>
      <td align="center" style="padding: 24px;">
        
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width: 100%; max-width: 520px; background-color: #ffffff; border: 1px solid #e5e5e5; border-radius: 14px;" class="card-bg border">
          <tr>
            <td style="padding: 28px;">
              
              <h1 style="margin: 0 0 8px 0; font-family: -apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 600; line-height: 1.3; color: #111111; letter-spacing: -0.01em;" class="title">
                Email preferences
              </h1>
              
              <p style="margin: 0 0 24px 0; font-family: -apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.5; color: #666666;" class="body-text">
                You're receiving this email based on your previous preferences. You can update them here.
              </p>
              
              <!-- Unsubscribe button -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" style="background-color: #111111; border-radius: 10px; padding: 14px 16px;" class="btn-primary">
                    <a href="#unsubscribe" style="display: block; font-family: -apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 500; color: #ffffff; text-decoration: none;">Unsubscribe</a>
                  </td>
                </tr>
              </table>
              
              <!-- Keep receiving button -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top: 12px;">
                <tr>
                  <td align="center" style="background-color: transparent; border: 1px solid #d1d1d1; border-radius: 10px; padding: 14px 16px;" class="btn-secondary">
                    <a href="#keep" style="display: block; font-family: -apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 500; color: #111111; text-decoration: none;">Keep receiving emails</a>
                  </td>
                </tr>
              </table>
              
              <p align="center" style="margin: 20px 0 0 0; font-family: -apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; line-height: 1.5; color: #999999;" class="footer-text">Changes take effect immediately.</p>
              
            </td>
          </tr>
        </table>
        
      </td>
    </tr>
  </table>
  
</body>
</html>
