<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>404: NOT_FOUND</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link href="/css/site.css" rel="stylesheet" />
  </head>
  <body>
    <main class="status-page">
      <section class="status-card" role="alert">
        <div class="status-head select-none">
          <span class="status-code">404</span>
          <h1>Not found</h1>
        </div>
        <p>No page exists at this address.</p>
        <dl class="status-meta">
          <div>
            <dt class="select-none">Code</dt>
            <dd><code>NOT_FOUND</code></dd>
          </div>
          <div>
            <dt class="select-none">Timestamp</dt>
            <dd><code id="ts">—</code></dd>
          </div>
        </dl>
        <p class="status-hint select-none">Check the address, or go back to the previous page.</p>
        <a href="/" class="back-link select-none">&larr; Go back</a>
      </section>
    </main>
    <script src="/js/status.js" defer></script>
  </body>
</html>
