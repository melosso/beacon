<!-- Email Settings Modal -->
<dialog
  class="modal-backdrop"
  id="emailSettingsModal"
  aria-labelledby="emailSettingsModalTitle"
  data-self
  data-click="closeEmailSettingsModal"
>
  <div class="modal modal--lg">
    <div class="modal-header">
      <h3 id="emailSettingsModalTitle">Email notifications</h3>
      <button
        class="btn btn-icon"
        data-click="closeEmailSettingsModal"
        aria-label="Close"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>
    <p>
      Configure how Beacon sends outgoing emails, such as opt-in confirmations.
    </p>
    <div class="form-group">
      <label for="emailProvider">Provider</label>
      <select
        id="emailProvider"
        data-change="showEmailProviderFields $value"
      >
        <option value="none">None</option>
        <option value="resend">Resend</option>
        <option value="smtp">SMTP</option>
      </select>
    </div>

    <!-- Resend-specific fields -->
    <div id="email-fields-resend" hidden>
      <div class="form-group">
        <label for="emailResendApiKey">API key</label>
        <div class="input-reveal-wrapper">
          <input
            type="password"
            id="emailResendApiKey"
            placeholder="re_••••••••••••••••••••••••"
            autocomplete="off"
          />
          <button
            type="button"
            class="btn-reveal"
            data-click="toggleReveal emailResendApiKey $el"
            aria-label="Show or hide API key"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- SMTP-specific fields -->
    <div id="email-fields-smtp" hidden>
      <div class="grid grid-2-narrow gap-3">
        <div class="form-group">
          <label for="emailSmtpHost">Host</label>
          <input
            type="text"
            id="emailSmtpHost"
            placeholder="smtp.example.com"
            autocomplete="off"
          />
        </div>
        <div class="form-group">
          <label for="emailSmtpPort">Port</label>
          <input
            type="number"
            id="emailSmtpPort"
            placeholder="587"
            min="1"
            max="65535"
          />
        </div>
      </div>
      <div class="grid grid-2 gap-3">
        <div class="form-group">
          <label for="emailSmtpUsername">Username</label>
          <input
            type="text"
            id="emailSmtpUsername"
            placeholder="username"
            autocomplete="off"
          />
        </div>
        <div class="form-group">
          <label for="emailSmtpPassword">Password</label>
          <div class="input-reveal-wrapper">
            <input
              type="password"
              id="emailSmtpPassword"
              placeholder="••••••••"
              autocomplete="new-password"
            />
            <button
              type="button"
              class="btn-reveal"
              data-click="toggleReveal emailSmtpPassword $el"
              aria-label="Show/hide password"
            >
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>
      </div>
      <label
        class="settings-item-card mb-3"
        for="emailSmtpUseTls"
      >
        <div class="settings-item-info">
          <span
            class="settings-item-title select-none"
            >Use TLS / STARTTLS</span
          >
          <p class="settings-item-desc">
            Encrypt the connection to the mail server.
          </p>
        </div>
        <div class="settings-item-control">
          <input type="checkbox" id="emailSmtpUseTls" />
          <span class="toggle-track"></span>
        </div>
      </label>
    </div>

    <!-- Shared sender fields (Resend + SMTP) -->
    <div id="email-fields-sender" hidden>
      <div class="grid grid-2 gap-3">
        <div class="form-group">
          <label for="emailFromAddress">From address</label>
          <input
            type="email"
            id="emailFromAddress"
            placeholder="noreply@example.com"
            autocomplete="off"
          />
        </div>
        <div class="form-group">
          <label for="emailFromName">From name</label>
          <input
            type="text"
            id="emailFromName"
            placeholder="Beacon"
            autocomplete="off"
          />
        </div>
      </div>
    </div>

    <!-- Queue section (Resend + SMTP) -->
    <div id="email-fields-queue" hidden>
      <hr class="settings-sep" />
      <label class="settings-item-card" for="emailQueueEnabled">
        <div class="settings-item-info">
          <span
            class="settings-item-title select-none"
            >Built-in email queue</span
          >
          <p class="settings-item-desc">
            Queue outgoing emails within Beacon and retry on delivery failure.
            Recommended without a managed email platform.
          </p>
        </div>
        <div class="settings-item-control">
          <input type="checkbox" id="emailQueueEnabled" />
          <span class="toggle-track"></span>
        </div>
      </label>
    </div>

    <div class="modal-actions">
      <button class="btn btn-outline" data-click="closeEmailSettingsModal">
        Cancel
      </button>
      <button class="btn btn-primary" data-click="saveEmailSettings">
        Save changes
      </button>
    </div>
  </div>
</dialog>
