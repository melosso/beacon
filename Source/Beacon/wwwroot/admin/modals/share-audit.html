<!-- Audit Custom Fields Modal -->
<dialog
  class="modal-backdrop"
  id="auditCustomFieldsModal"
  aria-labelledby="auditCustomFieldsModalTitle"
  data-self
  data-click="closeAuditCustomFieldsModal"
>
  <div class="modal">
    <div class="modal-header">
      <h3 id="auditCustomFieldsModalTitle">Custom fields</h3>
      <button
        class="btn btn-icon"
        data-click="closeAuditCustomFieldsModal"
        aria-label="Close"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>
    <p>Data captured with this consent change.</p>
    <div class="custom-fields-list" id="auditCustomFieldsList"></div>
    <div class="modal-actions">
      <button class="btn btn-primary" data-click="closeAuditCustomFieldsModal">
        Done
      </button>
    </div>
  </div>
</dialog>

<!-- Confirm Modal -->
<dialog
  class="modal-backdrop"
  id="confirmModal"
  aria-labelledby="confirmModalTitle"
  data-self
  data-click="closeConfirmModal"
>
  <div class="modal modal--sm">
    <div class="modal-header">
      <h3 id="confirmModalTitle"></h3>
      <button
        class="btn btn-icon"
        data-click="closeConfirmModal"
        aria-label="Close"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>
    <p id="confirmModalMessage"></p>
    <div class="modal-actions">
      <button class="btn btn-outline" data-click="closeConfirmModal">
        Cancel
      </button>
      <button
        class="btn btn-destructive"
        id="confirmModalBtn"
        data-click="executeConfirmAction"
      >
        <span class="btn-label"></span>
      </button>
    </div>
  </div>
</dialog>
