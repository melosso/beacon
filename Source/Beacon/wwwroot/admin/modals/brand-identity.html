<!-- Create Brand Identity Modal -->
<dialog
  class="modal-backdrop"
  id="createBrandIdentityModal"
  aria-labelledby="createBrandIdentityModalTitle"
  data-self
  data-click="closeCreateBrandIdentityModal"
>
  <div class="modal modal--sm">
    <div class="modal-header">
      <h3 id="createBrandIdentityModalTitle">Add identity</h3>
      <button
        class="btn btn-icon"
        data-click="closeCreateBrandIdentityModal"
        aria-label="Close"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>
    <p>Name shown for this identity in the admin panel.</p>
    <div class="form-group">
      <label for="newBrandIdentityName">Name <span class="required" title="Required">*</span></label>
      <input
        type="text"
        id="newBrandIdentityName"
        placeholder="e.g., Acme Corp"
        autocomplete="off"
        maxlength="100"
        data-enter="confirmCreateBrandIdentity"
        data-input="validateBrandIdentityName"
      />
      <p class="field-hint text-danger" id="newBrandIdentityError" hidden></p>
    </div>
    <div class="modal-actions">
      <button
        class="btn btn-outline"
        data-click="closeCreateBrandIdentityModal"
      >
        Cancel
      </button>
      <button
        class="btn btn-primary"
        id="createBrandIdentityBtn"
        data-click="confirmCreateBrandIdentity"
      >
        <span class="btn-label">Create</span><span class="spinner"></span>
      </button>
    </div>
  </div>
</dialog>

<!-- Edit Brand Identity Modal -->
<dialog
  class="modal-backdrop"
  id="editBrandIdentityModal"
  aria-labelledby="editBrandIdentityTitle"
  data-self
  data-click="closeEditBrandIdentityModal"
>
  <div class="modal modal--xl">
    <div class="modal-header">
      <h3 id="editBrandIdentityTitle">Edit identity</h3>
      <button
        class="btn btn-icon"
        data-click="closeEditBrandIdentityModal"
        aria-label="Close"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>
    <div id="editBrandIdentityBody"></div>
    <div class="modal-actions modal-actions--split">
      <button
        class="btn btn-destructive mr-auto"
        id="editBrandIdentityDeleteBtn"
        data-click="deleteEditingBrandIdentity"
      >
        Delete
      </button>
      <button class="btn btn-outline" data-click="closeEditBrandIdentityModal">
        Cancel
      </button>
      <button
        class="btn btn-primary"
        id="editBrandIdentityBtn"
        data-click="saveEditBrandIdentity"
      >
        <span class="btn-label">Save</span><span class="spinner"></span>
      </button>
    </div>
  </div>
</dialog>
