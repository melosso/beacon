<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="32x32" />
    <link href="/css/site.css" rel="stylesheet" />
    <script src="/js/theme.js"></script>
    <title>Beacon</title>
  </head>
  <body>
    <div
      class="toast-container"
      id="toastContainer"
      role="status"
      aria-live="polite"
      popover="manual"
    ></div>

    <header class="mobile-bar select-none">
      <button
        type="button"
        class="btn-icon mobile-bar-toggle"
        popovertarget="sidebar"
        aria-label="Open navigation"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <line x1="4" y1="7" x2="20" y2="7" />
          <line x1="4" y1="12" x2="20" y2="12" />
          <line x1="4" y1="17" x2="20" y2="17" />
        </svg>
      </button>
      <span class="brand-name">Beacon</span>
    </header>

    <div class="app-shell">
      <aside id="sidebar" popover>
        <div class="brand select-none">
          <div class="brand-avatar">
            <svg
              viewBox="0 0 20 20"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              class="brand-avatar-bg"
              aria-hidden="true"
            >
              <g clip-path="url(#beacon-avatar-clip)">
                <rect width="20" height="20" fill="#000" rx="5.5" />
                <rect
                  width="20"
                  height="20"
                  fill="url(#beacon-avatar-gradient)"
                  fill-opacity="0.2"
                  rx="5.5"
                />
                <g filter="url(#beacon-avatar-blur-1)" opacity="0.3">
                  <circle
                    cx="16"
                    cy="17"
                    r="6"
                    fill="#FF64B4"
                    fill-opacity="0.671"
                  />
                </g>
                <g filter="url(#beacon-avatar-blur-2)" opacity="0.1">
                  <circle
                    cx="16"
                    cy="16"
                    r="6"
                    fill="#FF64B4"
                    fill-opacity="0.671"
                  />
                </g>
                <g filter="url(#beacon-avatar-blur-3)" opacity="0.4">
                  <circle
                    cx="17"
                    cy="19"
                    r="6"
                    fill="#FF64B4"
                    fill-opacity="0.671"
                  />
                </g>
                <rect
                  width="20"
                  height="20"
                  fill="#FF64B4"
                  fill-opacity="0.15"
                  rx="5.5"
                />
                <g class="blend-hard-light">
                  <rect
                    width="20"
                    height="20"
                    fill="#6A62FF"
                    fill-opacity="0.1"
                    rx="5.5"
                  />
                </g>
              </g>
              <rect
                width="19"
                height="19"
                x="0.5"
                y="0.5"
                stroke="#FDFDFD"
                stroke-opacity="0.1"
                rx="5"
              />
              <defs>
                <filter
                  id="beacon-avatar-blur-1"
                  width="32"
                  height="32"
                  x="0"
                  y="1"
                  color-interpolation-filters="sRGB"
                  filterUnits="userSpaceOnUse"
                >
                  <feFlood flood-opacity="0" result="BackgroundImageFix" />
                  <feBlend
                    in="SourceGraphic"
                    in2="BackgroundImageFix"
                    result="shape"
                  />
                  <feGaussianBlur
                    result="effect1_foregroundBlur"
                    stdDeviation="5"
                  />
                </filter>
                <filter
                  id="beacon-avatar-blur-2"
                  width="22"
                  height="22"
                  x="5"
                  y="5"
                  color-interpolation-filters="sRGB"
                  filterUnits="userSpaceOnUse"
                >
                  <feFlood flood-opacity="0" result="BackgroundImageFix" />
                  <feBlend
                    in="SourceGraphic"
                    in2="BackgroundImageFix"
                    result="shape"
                  />
                  <feGaussianBlur
                    result="effect1_foregroundBlur"
                    stdDeviation="2.5"
                  />
                </filter>
                <filter
                  id="beacon-avatar-blur-3"
                  width="22"
                  height="22"
                  x="6"
                  y="8"
                  color-interpolation-filters="sRGB"
                  filterUnits="userSpaceOnUse"
                >
                  <feFlood flood-opacity="0" result="BackgroundImageFix" />
                  <feBlend
                    in="SourceGraphic"
                    in2="BackgroundImageFix"
                    result="shape"
                  />
                  <feGaussianBlur
                    result="effect1_foregroundBlur"
                    stdDeviation="2.5"
                  />
                </filter>
                <linearGradient
                  id="beacon-avatar-gradient"
                  x1="10"
                  x2="10"
                  y1="0"
                  y2="20"
                  gradientUnits="userSpaceOnUse"
                >
                  <stop stop-color="#FDFDFD" />
                  <stop offset="1" stop-color="#FDFDFD" stop-opacity="0" />
                </linearGradient>
                <clipPath id="beacon-avatar-clip">
                  <rect width="20" height="20" fill="#FDFDFD" rx="5.5" />
                </clipPath>
              </defs>
            </svg>
            <svg
              class="brand-avatar-icon"
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#FDFDFD"
              stroke-width="2.5"
              aria-hidden="true"
            >
              <path
                d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"
              />
            </svg>
          </div>
          <span class="brand-name select-none">Beacon</span>
        </div>

        <div class="nav-group select-none">
          <div class="nav-label">Navigation</div>
          <a
            href="#"
            class="nav-item"
            data-view="overview"
            data-click="showView overview"
            >Buckets</a
          >
          <a
            href="#"
            class="nav-item"
            data-view="subscriptions"
            data-click="showView subscriptions"
            >Subscribers</a
          >
          <a
            href="#"
            class="nav-item"
            id="navWorkflow"
            data-view="workflow"
            data-click="showView workflow"
            >Workflow</a
          >
        </div>

        <div class="nav-group nav-group--fill">
          <div class="nav-label-container">
            <div class="nav-label select-none">Buckets</div>
            <div class="nav-label-actions">
              <span class="tooltip-wrapper">
                <button
                  class="btn-sidebar"
                  id="btnSort"
                  data-click="cycleSidebarSort"
                  aria-label="Sort buckets"
                >
                  <svg
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    id="btnSortIcon"
                  >
                    <path d="M4 6h16" />
                    <path d="M4 12h10" />
                    <path d="M4 18h4" />
                  </svg>
                </button>
                <span
                  class="tooltip tooltip-above tooltip-right"
                  id="btnSortTooltip"
                  >Sort buckets</span
                >
              </span>
              <span class="tooltip-wrapper">
                <button
                  class="btn-sidebar"
                  id="btnDisplayMode"
                  data-click="toggleSidebarDisplay"
                  aria-label="Show code names"
                >
                  <svg
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <polyline points="16 18 22 12 16 6" />
                    <polyline points="8 6 2 12 8 18" />
                  </svg>
                </button>
                <span
                  class="tooltip tooltip-above tooltip-right"
                  id="btnDisplayTooltip"
                  >Show code names</span
                >
              </span>
              <span class="tooltip-wrapper">
                <button
                  class="btn-plus"
                  data-click="toggleBucketSubmenu $event"
                  aria-label="Bucket actions"
                  aria-controls="bucketSubmenu"
                >
                  <svg
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                  >
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                  </svg>
                </button>
                <span class="tooltip tooltip-above tooltip-right"
                  >Bucket actions</span
                >
              </span>
            </div>
          </div>

          <div class="submenu" id="bucketSubmenu">
            <a
              href="#"
              class="nav-item"
              data-view="new-bucket"
              data-click="showView new-bucket"
            >
              <svg class="nav-icon" aria-hidden="true"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"
                />
              </svg>
              New bucket
            </a>
            <a
              href="#"
              class="nav-item"
              data-view="new-token"
              data-click="showView new-token"
            >
              <svg class="nav-icon" aria-hidden="true"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0110 0v4" />
              </svg>
              New token
            </a>
          </div>

          <div id="bucketsList" class="select-none"></div>
        </div>

        <div class="nav-group select-none">
          <div class="nav-label-container">
            <div class="nav-label">Modules</div>
            <div class="nav-label-actions">
              <span class="tooltip-wrapper">
                <button
                  class="btn-plus"
                  data-click="toggleModulesSubmenu $event"
                  aria-label="Module actions"
                  aria-controls="modulesSubmenu"
                >
                  <svg
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                  >
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                  </svg>
                </button>
                <span class="tooltip tooltip-above tooltip-right"
                  >Module actions</span
                >
              </span>
            </div>
          </div>

          <div class="submenu" id="modulesSubmenu">
            <a
              href="#"
              class="nav-item"
              data-view="submission-create"
              data-click="showView submission-create"
            >
              <svg class="nav-icon" aria-hidden="true"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                />
                <polyline points="22,6 12,13 2,6" />
              </svg>
              New submission form
            </a>
          </div>

          <a
            href="#"
            class="nav-item"
            data-view="submissions"
            data-click="showView submissions"
          >
            Forms
          </a>
          <a
            href="#"
            class="nav-item"
            data-view="audit"
            data-click="showView audit"
          >
            Audit
          </a>
        </div>

        <div class="sidebar-footer select-none">
          <div class="sidebar-user" id="sidebarUser">
            <div class="sidebar-user-avatar" id="sidebarUserAvatar">A</div>
            <span class="sidebar-user-name" id="sidebarUserName"
              >Administrator</span
            >
          </div>

          <a
            href="#"
            class="nav-item sidebar-settings-item"
            data-view="settings"
            data-click="showView settings"
          >
            <svg
              class="nav-icon"
              aria-hidden="true"
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="3"></circle>
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
              ></path>
            </svg>
            Settings
          </a>

          <div class="sidebar-footer-actions">
            <button class="btn btn-outline btn-sm grow" data-click="logout">
              Log out
            </button>

            <span class="tooltip-wrapper">
              <a
                id="openapi-link"
                href="/openapi"
                target="_blank"
                class="github-link"
                aria-label="OpenAPI documentation"
              >
                <svg
                  aria-hidden="true"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                  ></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                  <line x1="16" y1="13" x2="8" y2="13"></line>
                  <line x1="16" y1="17" x2="8" y2="17"></line>
                  <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
              </a>
              <span class="tooltip tooltip-above tooltip-right"
                >OpenAPI documentation</span
              >
            </span>

            <span class="tooltip-wrapper">
              <a
                href="https://github.com/melosso/beacon"
                target="_blank"
                rel="noopener"
                class="github-link"
                aria-label="View on GitHub"
              >
                <svg
                  aria-hidden="true"
                  width="16"
                  height="16"
                  class="github-icon"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                >
                  <path
                    d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"
                  />
                </svg>
              </a>
              <span class="tooltip tooltip-above tooltip-right"
                >View on GitHub</span
              >
            </span>
          </div>
        </div>
      </aside>

      <main id="mainContent">
