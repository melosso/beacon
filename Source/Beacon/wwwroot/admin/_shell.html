<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="32x32" />
    <link href="/css/fonts.css" rel="stylesheet" />
    <link href="/css/site.css" rel="stylesheet" />
    <script src="/js/theme.js"></script>
    <title>Beacon</title>
  </head>
  <body>
    <div
      class="toast-container"
      id="toastContainer"
      role="status"
      aria-live="polite"
      popover="manual"
    ></div>

    <header class="mobile-bar select-none">
      <button
        type="button"
        class="btn-icon mobile-bar-toggle"
        popovertarget="sidebar"
        aria-label="Open navigation"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <line x1="4" y1="7" x2="20" y2="7" />
          <line x1="4" y1="12" x2="20" y2="12" />
          <line x1="4" y1="17" x2="20" y2="17" />
        </svg>
      </button>
      <span class="brand-name">Beacon</span>
    </header>

    <div class="app-shell">
      <aside id="sidebar" popover>
        <button
          type="button"
          class="brand select-none"
          id="sidebarToggle"
          data-click="toggleSidebar"
          title="Collapse sidebar"
          aria-expanded="true"
        >
          <div class="brand-avatar">
            <svg
              viewBox="0 0 20 20"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              class="brand-avatar-bg"
              aria-hidden="true"
            >
              <g clip-path="url(#beacon-avatar-clip)">
                <rect width="20" height="20" fill="#000" rx="5.5" />
                <rect
                  width="20"
                  height="20"
                  fill="url(#beacon-avatar-gradient)"
                  fill-opacity="0.2"
                  rx="5.5"
                />
                <g filter="url(#beacon-avatar-blur-1)" opacity="0.3">
                  <circle
                    cx="16"
                    cy="17"
                    r="6"
                    fill="#FF64B4"
                    fill-opacity="0.671"
                  />
                </g>
                <g filter="url(#beacon-avatar-blur-2)" opacity="0.1">
                  <circle
                    cx="16"
                    cy="16"
                    r="6"
                    fill="#FF64B4"
                    fill-opacity="0.671"
                  />
                </g>
                <g filter="url(#beacon-avatar-blur-3)" opacity="0.4">
                  <circle
                    cx="17"
                    cy="19"
                    r="6"
                    fill="#FF64B4"
                    fill-opacity="0.671"
                  />
                </g>
                <rect
                  width="20"
                  height="20"
                  fill="#FF64B4"
                  fill-opacity="0.15"
                  rx="5.5"
                />
                <g class="blend-hard-light">
                  <rect
                    width="20"
                    height="20"
                    fill="#6A62FF"
                    fill-opacity="0.1"
                    rx="5.5"
                  />
                </g>
              </g>
              <rect
                width="19"
                height="19"
                x="0.5"
                y="0.5"
                stroke="#FDFDFD"
                stroke-opacity="0.1"
                rx="5"
              />
              <defs>
                <filter
                  id="beacon-avatar-blur-1"
                  width="32"
                  height="32"
                  x="0"
                  y="1"
                  color-interpolation-filters="sRGB"
                  filterUnits="userSpaceOnUse"
                >
                  <feFlood flood-opacity="0" result="BackgroundImageFix" />
                  <feBlend
                    in="SourceGraphic"
                    in2="BackgroundImageFix"
                    result="shape"
                  />
                  <feGaussianBlur
                    result="effect1_foregroundBlur"
                    stdDeviation="5"
                  />
                </filter>
                <filter
                  id="beacon-avatar-blur-2"
                  width="22"
                  height="22"
                  x="5"
                  y="5"
                  color-interpolation-filters="sRGB"
                  filterUnits="userSpaceOnUse"
                >
                  <feFlood flood-opacity="0" result="BackgroundImageFix" />
                  <feBlend
                    in="SourceGraphic"
                    in2="BackgroundImageFix"
                    result="shape"
                  />
                  <feGaussianBlur
                    result="effect1_foregroundBlur"
                    stdDeviation="2.5"
                  />
                </filter>
                <filter
                  id="beacon-avatar-blur-3"
                  width="22"
                  height="22"
                  x="6"
                  y="8"
                  color-interpolation-filters="sRGB"
                  filterUnits="userSpaceOnUse"
                >
                  <feFlood flood-opacity="0" result="BackgroundImageFix" />
                  <feBlend
                    in="SourceGraphic"
                    in2="BackgroundImageFix"
                    result="shape"
                  />
                  <feGaussianBlur
                    result="effect1_foregroundBlur"
                    stdDeviation="2.5"
                  />
                </filter>
                <linearGradient
                  id="beacon-avatar-gradient"
                  x1="10"
                  x2="10"
                  y1="0"
                  y2="20"
                  gradientUnits="userSpaceOnUse"
                >
                  <stop stop-color="#FDFDFD" />
                  <stop offset="1" stop-color="#FDFDFD" stop-opacity="0" />
                </linearGradient>
                <clipPath id="beacon-avatar-clip">
                  <rect width="20" height="20" fill="#FDFDFD" rx="5.5" />
                </clipPath>
              </defs>
            </svg>
            <svg
              class="brand-avatar-icon"
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#FDFDFD"
              stroke-width="2.5"
              aria-hidden="true"
            >
              <path
                d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"
              />
            </svg>
          </div>
          <span class="brand-name select-none">Beacon</span>
          <svg class="brand-collapse" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>

        <div class="nav-group select-none">
          <a
            href="#"
            class="nav-item"
            data-view="overview"
            data-click="showView overview" title="Buckets"
          >
            <svg class="nav-icon" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>
            <span>Buckets</span>
          </a>
          <a
            href="#"
            class="nav-item"
            data-view="subscriptions"
            data-click="showView subscriptions" title="Subscribers"
          >
            <svg class="nav-icon" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span>Subscribers</span>
          </a>
          <a
            href="#"
            class="nav-item"
            id="navWorkflow"
            data-view="workflow"
            data-click="showView workflow" title="Workflow"
          >
            <svg class="nav-icon" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="15" width="6" height="6" rx="1"/><path d="M6 9v3a3 3 0 0 0 3 3h6"/></svg>
            <span>Workflow</span>
          </a>
        </div>

        <div class="nav-group nav-group--fill">
          <div class="nav-label-container">
            <div class="nav-label select-none">Buckets</div>
            <div class="nav-label-actions">
              <span class="tooltip-wrapper">
                <button
                  class="btn-sidebar"
                  id="btnSort"
                  data-click="cycleSidebarSort"
                  aria-label="Sort buckets"
                >
                  <svg
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    id="btnSortIcon"
                  >
                    <path d="M4 6h16" />
                    <path d="M4 12h10" />
                    <path d="M4 18h4" />
                  </svg>
                </button>
                <span
                  class="tooltip tooltip-above tooltip-right"
                  id="btnSortTooltip"
                  >Sort buckets</span
                >
              </span>
              <span class="tooltip-wrapper">
                <button
                  class="btn-sidebar"
                  id="btnDisplayMode"
                  data-click="toggleSidebarDisplay"
                  aria-label="Show code names"
                >
                  <svg
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <polyline points="16 18 22 12 16 6" />
                    <polyline points="8 6 2 12 8 18" />
                  </svg>
                </button>
                <span
                  class="tooltip tooltip-above tooltip-right"
                  id="btnDisplayTooltip"
                  >Show code names</span
                >
              </span>
            </div>
          </div>

          <div id="bucketsList" class="select-none"></div>
        </div>

        <div class="nav-group select-none">
          <div class="nav-label-container">
            <div class="nav-label">Modules</div>
          </div>

          <a
            href="#"
            class="nav-item"
            data-view="submissions"
            data-click="showView submissions" title="Forms"
          >
            <svg class="nav-icon" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
            <span>Forms</span>
          </a>
          <a
            href="#"
            class="nav-item"
            data-view="audit"
            data-click="showView audit" title="Audit"
          >
            <svg class="nav-icon" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            <span>Audit</span>
          </a>
        </div>

        <div class="sidebar-footer select-none">
          <button
            type="button"
            class="account-trigger"
            data-stop
            data-click="toggleAccountMenu $el"
            aria-haspopup="menu"
            aria-controls="accountMenu"
            title="Account"
          >
            <span class="account-avatar" id="sidebarUserAvatar">A</span>
            <span class="account-meta">
              <span class="account-name" id="sidebarUserName">Admin</span>
              <span class="account-version" id="sidebarVersion"></span>
            </span>
            <svg class="account-chevron" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>
          </button>
          <div class="dropdown-menu account-menu" id="accountMenu" role="menu" aria-label="Account">
            <a href="#" class="dropdown-item" role="menuitem" data-view="settings" data-click="openAccountMenuView settings">Settings</a>
            <a id="openapi-link" class="dropdown-item" role="menuitem" target="_blank" rel="noopener">OpenAPI documentation</a>
            <a href="https://github.com/melosso/beacon" class="dropdown-item" role="menuitem" target="_blank" rel="noopener">View on GitHub</a>
            <hr class="account-menu-sep" />
            <button type="button" class="dropdown-item" role="menuitem" data-click="logout">Log out</button>
          </div>
        </div>
      </aside>

      <main id="mainContent">
