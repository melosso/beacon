    <!-- Workflow View -->
    <div id="view-workflow" class="view">
      <section class="header-container" style="flex-shrink:0">
        <div>
          <h1 class="select-none">Workflow</h1>
          <span class="status-badge select-none">Overview</span>
        </div>
        <div class="bucket-actions">
          <span class="tooltip-wrapper">
            <button class="btn btn-outline" id="workflowArchiveToggle" onclick="toggleWorkflowArchived()">Show archived</button>
            <span class="tooltip">Show completed workflows</span>
          </span>
          <span class="tooltip-wrapper">
            <button class="btn btn-outline" onclick="loadWorkflowPage()">Refresh</button>
            <span class="tooltip">Reload workflow</span>
          </span>
          <span class="tooltip-wrapper">
            <button class="btn btn-outline" id="workflowRunBtn" onclick="triggerDataPoliciesRun()"><span class="btn-label">Run Now</span><span class="spinner"></span></button>
            <span class="tooltip">Run data policies immediately</span>
          </span>
        </div>
      </section>
      <div id="workflow-policy-notice" style="display:none;margin:0.75rem 2rem -0.25rem;padding:0.75rem 1rem;background:hsl(var(--muted));border-radius:var(--radius);border:1px solid hsl(var(--border));font-size:0.85rem;color:hsl(var(--muted-foreground));flex-shrink:0">
        No policies are enabled. Go to <a href="#" onclick="showView('settings');showSettingsSection('data-policies');return false;" style="color:hsl(var(--foreground));text-decoration:underline">Settings → Data Policies</a> to configure and enable policies.
      </div>
      <div class="table-wrapper">
        <div class="scroll-area">
          <table>
            <thead>
              <tr>
                <th>Task</th>
                <th>Triggered by</th>
                <th>Queued</th>
                <th>Records</th>
                <th>Status</th>
                <th class="col-actions"></th>
              </tr>
            </thead>
            <tbody id="workflowTbody">
              <tr><td colspan="6" style="text-align:center;padding:2rem;color:hsl(var(--muted-foreground));font-size:0.875rem">No items awaiting approval.</td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination-container" id="workflowPaginationBar" style="display:none">
          <div class="pagination-settings">
            <div class="page-size-selector">
              <span>Show</span>
              <select class="page-size-input" id="workflowPageSize" onchange="updateWorkflowPageSize()">
                <option value="10">10</option>
                <option value="25" selected>25</option>
                <option value="50">50</option>
              </select>
              <span>per page</span>
            </div>
            <div class="pagination-info" id="workflowPaginationInfo"></div>
          </div>
          <div style="display:flex;gap:0.5rem">
            <button class="btn btn-outline" id="workflowPrevBtn" onclick="changeWorkflowPage(-1)">Previous</button>
            <button class="btn btn-outline" id="workflowNextBtn" onclick="changeWorkflowPage(1)">Next</button>
          </div>
        </div>
      </div>
    </div>
