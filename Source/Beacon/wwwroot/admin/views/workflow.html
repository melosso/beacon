<!-- Workflow View -->
<div id="view-workflow" class="view">
  <section class="header-container">
    <div>
      <h1 class="select-none">Workflow</h1>
      <span class="status-badge select-none">Overview</span>
    </div>
    <div class="bucket-actions">
      <span class="tooltip-wrapper">
        <button
          class="btn btn-outline"
          id="workflowArchiveToggle"
          data-click="toggleWorkflowArchived"
        >
          Show archived
        </button>
        <span class="tooltip">Include completed tasks</span>
      </span>
      <button class="btn btn-outline" data-click="loadWorkflowPage">
        Refresh
      </button>
      <span class="tooltip-wrapper">
        <button
          class="btn btn-outline"
          id="workflowRunBtn"
          data-click="triggerDataPoliciesRun"
        >
          <span class="btn-label">Run now</span><span class="spinner"></span>
        </button>
        <span class="tooltip">Run data policies immediately</span>
      </span>
    </div>
  </section>
  <div class="notice mb-4" id="workflow-policy-notice" hidden>
    No policies are enabled. Enable policies in
    <a href="#" data-click="openSettingsSection data-policies"
      >Settings → Policies</a
    >.
  </div>
  <div class="table-wrapper">
    <div class="scroll-area">
      <table>
        <thead>
          <tr>
            <th>Task</th>
            <th>Triggered by</th>
            <th>Queued</th>
            <th>Records</th>
            <th>Status</th>
            <th class="col-actions"></th>
          </tr>
        </thead>
        <tbody id="workflowTbody">
          <tr>
            <td class="table-empty" colspan="6">
              No items awaiting approval.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="pagination-container" id="workflowPaginationBar" hidden>
      <div class="pagination-settings">
        <div class="page-size-selector">
          <span>Show</span>
          <select
            class="page-size-input"
            id="workflowPageSize"
            data-change="updateWorkflowPageSize"
          >
            <option value="10">10</option>
            <option value="25" selected>25</option>
            <option value="50">50</option>
          </select>
          <span>per page</span>
        </div>
        <div class="pagination-info" id="workflowPaginationInfo"></div>
      </div>
      <div class="flex gap-2">
        <button
          class="btn btn-outline"
          id="workflowPrevBtn"
          data-click="changeWorkflowPage -1"
        >
          Previous
        </button>
        <button
          class="btn btn-outline"
          id="workflowNextBtn"
          data-click="changeWorkflowPage 1"
        >
          Next
        </button>
      </div>
    </div>
  </div>
</div>
