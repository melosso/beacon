<!-- Submission List View -->
<div id="view-submissions" class="view">
  <section class="header-container">
    <div>
      <h1 class="select-none">Submission forms</h1>
      <span class="status-badge select-none">Configuration</span>
    </div>
    <div class="bucket-actions">
      <button class="btn btn-outline" data-click="loadSubmissionForms">
          Refresh
        </button>
      <button class="btn btn-primary" data-click="showView submission-create">
        New form
      </button>
    </div>
  </section>
  <div class="table-wrapper">
    <div class="scroll-area">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Bucket</th>
            <th>Permissions</th>
            <th>Origins</th>
            <th>Submissions</th>
            <th>Status</th>
            <th class="col-actions"></th>
          </tr>
        </thead>
        <tbody id="submissionBody"></tbody>
      </table>
    </div>
  </div>
</div>
