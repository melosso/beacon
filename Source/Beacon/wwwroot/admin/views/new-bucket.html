<dialog
  class="modal-backdrop sheet"
  id="newBucketSheet"
  aria-labelledby="newBucketTitle"
  data-self
  data-click="closeNewBucketSheet"
>
  <div class="modal" data-guard>
    <div class="modal-header">
      <h3 id="newBucketTitle">New bucket</h3>
      <button
        class="btn btn-icon"
        data-click="closeNewBucketSheet"
        aria-label="Close"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>
    <p>A bucket groups consent records. Add at least one permission.</p>

    <div class="form-group">
      <label for="newBucketName"
        >Bucket name
        <span class="required" title="Required field">*</span></label
      >
      <input
        type="text"
        id="newBucketName"
        placeholder="e.g., newsletter_en"
        autocomplete="off"
      />
    </div>

    <div class="form-group">
      <label for="createBucketPermInput">Permissions</label>
      <div id="newBucketPermsList" class="permissions-grid"></div>
      <div class="flex gap-2 mt-3">
        <input
          class="grow"
          type="text"
          id="createBucketPermInput"
          aria-label="Permission name"
          placeholder="Add permission…"
          data-enter="addNewBucketPerm"
        />
        <button
          type="button"
          class="btn btn-outline"
          data-click="addNewBucketPerm"
        >
          Add
        </button>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-primary" data-click="createNewBucket">
        Create bucket
      </button>
    </div>
  </div>
</dialog>
