    <!-- New Bucket View -->
    <div id="view-new-bucket" class="view" style="overflow-y:auto">
      <section class="header-container" style="flex-shrink:0">
        <div>
          <h1>Create Bucket</h1>
          <span class="status-badge">Bucket Management</span>
        </div>
      </section>
      <div class="modal" style="box-shadow:none;border:1px solid hsl(var(--border));margin-bottom:2rem">
        <h3>New Bucket</h3>
        <p>Create a new bucket to organize consent records. Add at least one permission to get started.</p>

        <div class="form-group">
          <label>Bucket Name <span class="required" title="Required field">*</span></label>
          <input type="text" id="newBucketName" placeholder="e.g., newsletter_en" autocomplete="off">
        </div>

        <div class="form-group">
          <label>Permissions</label>
          <div id="newBucketPermsList" class="permissions-grid"></div>
          <div style="display:flex;gap:0.5rem;margin-top:0.75rem">
            <input type="text" id="createBucketPermInput" placeholder="Add permission..." style="flex:1" onkeydown="if(event.key==='Enter'){event.preventDefault();addNewBucketPerm()}">
            <button type="button" class="btn btn-outline" onclick="addNewBucketPerm()">Add</button>
          </div>
        </div>

        <div class="modal-actions">
          <button class="btn btn-primary" onclick="createNewBucket()">Create Bucket</button>
        </div>
      </div>
    </div>
