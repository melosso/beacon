<!-- New Bucket View -->
<div id="view-new-bucket" class="view view--scroll">
  <section class="header-container">
    <div>
      <h1>New bucket</h1>
      <span class="status-badge">Bucket management</span>
    </div>
  </section>
  <div class="panel">
    <h3>Bucket details</h3>
    <p>
      A bucket groups consent records. Add at least one permission.
    </p>

    <div class="form-group">
      <label for="newBucketName"
        >Bucket name
        <span class="required" title="Required field">*</span></label
      >
      <input
        type="text"
        id="newBucketName"
        placeholder="e.g., newsletter_en"
        autocomplete="off"
      />
    </div>

    <div class="form-group">
      <label for="createBucketPermInput">Permissions</label>
      <div id="newBucketPermsList" class="permissions-grid"></div>
      <div class="flex gap-2 mt-3">
        <input
          class="grow"
          type="text"
          id="createBucketPermInput"
          aria-label="Permission name"
          placeholder="Add permission…"
          data-enter="addNewBucketPerm"
        />
        <button
          type="button"
          class="btn btn-outline"
          data-click="addNewBucketPerm"
        >
          Add
        </button>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-primary" data-click="createNewBucket">
        Create bucket
      </button>
    </div>
  </div>
</div>
