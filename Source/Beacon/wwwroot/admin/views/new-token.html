<!-- Tokens View -->
<div id="view-new-token" class="view view--scroll">
  <section class="header-container">
    <div>
      <h1>New token</h1>
      <span class="status-badge">Token management</span>
    </div>
  </section>
  <div class="panel">
    <h3>Consent record</h3>
    <p>
      Generates a signed token for the preference page. The record is stored in the selected bucket.
    </p>

    <div id="tokenFormFields">
      <div class="form-group">
        <label for="tokenBucket"
          >Bucket <span class="required" title="Required field">*</span></label
        >
        <div class="autocomplete-wrapper">
          <input
            type="text"
            id="tokenBucket"
            placeholder="e.g., Marketing_Campaign_Q1"
            autocomplete="off"
            data-input="showBucketSuggestions"
            data-focus="showBucketSuggestions"
          />
          <div class="autocomplete-dropdown" id="bucketAutocomplete"></div>
        </div>
      </div>

      <div class="form-group">
        <label for="tokenEmail"
          >Email address
          <span class="required" title="Required field">*</span></label
        >
        <input type="email" id="tokenEmail" placeholder="user@example.com" />
      </div>

      <div class="form-group">
        <label for="tokenName">Full name</label>
        <input
          type="text"
          id="tokenName"
          placeholder="Jane Doe"
          maxlength="250"
        />
      </div>

      <div class="form-group">
        <label for="newPermissionInput">Permissions</label>
        <div
          id="tokenDoubleOptInNotice"
          class="field-hint select-none mb-2" hidden
        >
          <svg
            class="icon-inline"
            aria-hidden="true"
            width="12"
            height="12"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
          Permissions set to "In" send a confirmation email.
        </div>
        <div class="permissions-grid" id="permissionsGrid">
          <!-- Generated by JS -->
        </div>
        <div class="flex gap-2 mt-3">
          <div class="autocomplete-wrapper grow">
            <input
              type="text"
              id="newPermissionInput"
              placeholder="Add custom permission…"
              aria-label="Custom permission"
              autocomplete="off"
              data-input="showPermissionSuggestions"
              data-focus="showPermissionSuggestions"
              data-stop
              data-click="showPermissionSuggestions"
              data-enter="addCustomPermission"
            />
            <div
              class="autocomplete-dropdown"
              id="permissionAutocomplete"
            ></div>
          </div>
          <button
            type="button"
            class="btn btn-outline"
            data-click="addCustomPermission"
          >
            Add
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="tokenExpiry">Expiry (days)</label>
        <input type="number" id="tokenExpiry" min="1" max="365" />
      </div>

      <div class="form-group">
        <label for="tokenLanguage">Language</label>
        <select id="tokenLanguage">
          <option value="en" selected>English</option>
          <option value="de">Deutsch</option>
          <option value="fr">Français</option>
          <option value="nl">Nederlands</option>
          <option value="pl">Polski</option>
          <option value="es">Español</option>
        </select>
      </div>

      <div class="form-group" id="tokenCustomFieldsGroup" hidden>
        <label>Custom fields</label>
        <div id="tokenCustomFieldsList" class="custom-fields-list"></div>
      </div>

      <div class="form-group">
        <label class="checkbox-toggle">
          <div>
            <div class="checkbox-toggle-label select-none">
              Allow multiple uses
            </div>
            <div class="checkbox-toggle-desc">
              The preference page accepts the token until it expires.
            </div>
          </div>
          <input type="checkbox" id="tokenAllowReplay" checked />
          <span class="toggle-track"></span>
        </label>
      </div>

      <div class="form-group" id="tokenSkipEmailGroup" hidden>
        <label class="checkbox-toggle">
          <div>
            <div class="checkbox-toggle-label select-none">
              Send confirmation email
            </div>
            <div class="checkbox-toggle-desc">
              Off: skips double opt-in for this record.
            </div>
          </div>
          <input type="checkbox" id="tokenSendConfirmation" checked />
          <span class="toggle-track"></span>
        </label>
      </div>
    </div>

    <div class="tooltip-wrapper" id="tokenOutputWrapper" hidden>
      <div
        class="token-output"
        id="tokenOutput"
        data-click="copyTokenLink"
      ></div>
      <span class="tooltip tooltip-above">Click to copy</span>
    </div>

    <div class="modal-actions">
      <button
        class="btn btn-primary"
        id="generateTokenBtn"
        data-click="handleGenerateToken"
      >
        Generate token
      </button>
      <button
        class="btn-square"
        id="viewTokenBucketBtn"
        data-click="openTokenBucketView"
        title="View in bucket"
        aria-label="View in bucket"
        hidden
      >
        <svg
          aria-hidden="true"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
      <button
        class="btn-square"
        data-click="openCustomFieldsDialog"
        title="Custom fields"
        aria-label="Custom fields"
      >
        <svg
          aria-hidden="true"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="3"></circle>
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
          ></path>
        </svg>
      </button>
    </div>
  </div>
</div>
