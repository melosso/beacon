    <!-- Tokens View -->
    <div id="view-new-token" class="view" style="overflow-y:auto">
      <section class="header-container" style="flex-shrink:0">
        <div>
          <h1>Create Token</h1>
          <span class="status-badge">Token Management</span>
        </div>
      </section>
      <div class="modal" style="box-shadow:none;border:1px solid hsl(var(--border));margin-bottom:2rem">
        <h3>Add Consent Record</h3>
        <p>Generate a secure token that allows users to manage their email preferences, stored in a specific bucket.</p>

        <div id="tokenFormFields">
          <div class="form-group">
            <label>Bucket <span class="required" title="Required field">*</span></label>
            <div class="autocomplete-wrapper">
              <input type="text" id="tokenBucket" placeholder="e.g., Marketing_Campaign_Q1" autocomplete="off" oninput="showBucketSuggestions()" onfocus="showBucketSuggestions()">
              <div class="autocomplete-dropdown" id="bucketAutocomplete"></div>
            </div>
          </div>

          <div class="form-group">
            <label>Email Address <span class="required" title="Required field">*</span></label>
            <input type="email" id="tokenEmail" placeholder="user@example.com">
          </div>

          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="tokenName" placeholder="Jane Doe" maxlength="250">
          </div>

          <div class="form-group">
            <label>Permissions (select state for each)</label>
            <div id="tokenDoubleOptInNotice" class="select-none" style="display:none;align-items:center;gap:0.375rem;font-size:0.75rem;color:hsl(var(--muted-foreground));margin-top:0.25rem;margin-bottom:0.5rem">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
              A confirmation email will be sent for any permissions set to "In".
            </div>
            <div class="permissions-grid" id="permissionsGrid">
              <!-- Generated by JS -->
            </div>
            <div style="display:flex;gap:0.5rem;margin-top:0.75rem">
              <div class="autocomplete-wrapper" style="flex:1">
                <input type="text" id="newPermissionInput" placeholder="Add custom permission..." autocomplete="off" oninput="showPermissionSuggestions()" onfocus="showPermissionSuggestions()" onclick="event.stopPropagation();showPermissionSuggestions()" onkeydown="if(event.key==='Enter'){event.preventDefault();addCustomPermission()}">
                <div class="autocomplete-dropdown" id="permissionAutocomplete"></div>
              </div>
              <button type="button" class="btn btn-outline" onclick="addCustomPermission()">Add</button>
            </div>
          </div>

          <div class="form-group">
            <label>Expiry (days)</label>
            <input type="number" id="tokenExpiry" min="1" max="365">
          </div>

          <div class="form-group">
            <label>Language</label>
            <select id="tokenLanguage">
              <option value="en" selected>English</option>
              <option value="de">Deutsch</option>
              <option value="fr">Français</option>
              <option value="nl">Nederlands</option>
              <option value="pl">Polski</option>
              <option value="es">Español</option>
            </select>
          </div>

          <div class="form-group" id="tokenCustomFieldsGroup" style="display:none">
            <label>Custom Fields</label>
            <div id="tokenCustomFieldsList" class="custom-fields-list"></div>
          </div>

          <div class="form-group">
            <label class="checkbox-toggle">
              <div>
                <div class="checkbox-toggle-label select-none">Allow multiple uses</div>
                <div class="checkbox-toggle-desc">User can revisit the preference page until token expires</div>
              </div>
              <input type="checkbox" id="tokenAllowReplay" checked>
              <span class="toggle-track"></span>
            </label>
          </div>

          <div class="form-group" id="tokenSkipEmailGroup" style="display:none">
            <label class="checkbox-toggle">
              <div>
                <div class="checkbox-toggle-label select-none">Send confirmation email</div>
                <div class="checkbox-toggle-desc">Uncheck to bypass double opt-in for this record only</div>
              </div>
              <input type="checkbox" id="tokenSendConfirmation" checked>
              <span class="toggle-track"></span>
            </label>
          </div>
        </div>

        <div class="tooltip-wrapper" id="tokenOutputWrapper" style="display:none">
          <div class="token-output" id="tokenOutput" onclick="copyTokenLink()" style="cursor:pointer"></div>
          <span class="tooltip tooltip-above">Click to copy</span>
        </div>

        <div class="modal-actions">
          <button class="btn btn-primary" id="generateTokenBtn" onclick="handleGenerateToken()">Generate Token</button>
          <button class="btn-icon" id="viewTokenBucketBtn" onclick="openTokenBucketView()" title="View in bucket" style="display:none;flex:0;padding:0.5rem;border:1px solid hsl(var(--border));border-radius:var(--radius);color:hsl(var(--foreground))">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
          <button class="btn-icon" onclick="openCustomFieldsDialog()" title="Custom Fields" style="flex:0;padding:0.5rem;border:1px solid hsl(var(--border));border-radius:var(--radius);color:hsl(var(--foreground))">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
