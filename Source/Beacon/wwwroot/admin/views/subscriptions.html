    <!-- Subscriptions View -->
    <div id="view-subscriptions" class="view">
      <section class="header-container">
        <div>
          <h1 class="select-none" id="subTitle">Subscribers</h1>
          <span class="status-badge select-none" id="subBadge">Overview</span>
        </div>
        <div class="bucket-actions">
          <button class="btn btn-outline" id="subBackBtn" style="display:none" onclick="loadIdentities()">&larr; Back</button>
          <span class="tooltip-wrapper" id="subRefreshWrapper">
            <button class="btn btn-outline" onclick="loadIdentities()">Refresh</button>
            <span class="tooltip tooltip-right">Reload identities</span>
          </span>
        </div>
      </section>

      <!-- Bulk action bar (visible when rows are selected) -->
      <div id="subBulkBar" style="display:none;align-items:center;gap:0.75rem;padding:0.5rem 0.75rem;margin-bottom:0.5rem;background:hsl(var(--muted));border-radius:var(--radius);border:1px solid hsl(var(--border))">
        <span id="subBulkCount" style="font-size:0.875rem;color:hsl(var(--muted-foreground))">0 selected</span>
        <button class="btn btn-outline" style="font-size:0.8rem;padding:0.3rem 0.75rem" onclick="openSubExportModal()">Export</button>
        <button class="btn btn-outline" style="font-size:0.8rem;padding:0.3rem 0.75rem;margin-left:auto" onclick="clearSubSelection()">Clear</button>
      </div>

      <div class="table-wrapper">
        <div class="scroll-area">
          <table>
            <thead>
              <tr id="subscriptionsTableHead">
                <th class="col-select"><label class="row-check" title="Select all"><input type="checkbox" id="subSelectAll" onchange="toggleSubSelectAll(this.checked)"></label></th>
                <th>E-mail</th>
                <th>Name</th>
                <th>Buckets</th>
                <th>Created</th>
                <th>Updated</th>
                <th class="col-actions"></th>
              </tr>
            </thead>
            <tbody id="subscriptionsBody"></tbody>
          </table>
        </div>
        <div class="pagination-container">
          <div class="pagination-settings">
            <div class="page-size-selector">
              <span>Show</span>
              <select class="page-size-input" id="subPageSize" onchange="updateSubPageSize()">
                <option value="10" selected>10</option>
                <option value="25">25</option>
                <option value="50">50</option>
                <option value="100">100</option>
              </select>
              <span>per page</span>
            </div>
            <div class="pagination-info" id="subPaginationInfo"></div>
          </div>
          <div style="display: flex; gap: 0.5rem;">
            <button class="btn btn-outline" id="subPrevBtn" onclick="changeSubPage(-1)">Previous</button>
            <button class="btn btn-outline" id="subNextBtn" onclick="changeSubPage(1)">Next</button>
          </div>
        </div>
      </div>
    </div>

  <!-- Subscriber Export Modal -->
  <div class="modal-backdrop" id="subExportModal" style="display:none" onclick="if(event.target===this)closeSubExportModal()">
    <div class="modal">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem">
        <h3 class="select-none" style="margin:0">Export Subscribers</h3>
        <button class="btn btn-icon" onclick="closeSubExportModal()" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <p>Export <strong id="subExportCount">0</strong> subscriber(s). Each row includes e-mail, Beacon ID, list count, created date, and last updated.</p>
      <div class="form-group">
        <label for="subExportFormat">Format</label>
        <select id="subExportFormat" class="input-auth" style="text-align:left;text-transform:none;font-family:inherit">
          <option value="csv">CSV</option>
          <option value="json">JSON</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeSubExportModal()">Cancel</button>
        <button class="btn btn-primary" id="subExportConfirmBtn" onclick="confirmSubExport()">Export</button>
      </div>
    </div>
  </div>
