<!-- Subscriptions View -->
<div id="view-subscriptions" class="view">
  <section class="header-container">
    <div>
      <h1 class="select-none" id="subTitle">Subscribers</h1>
      <span class="status-badge select-none" id="subBadge">Overview</span>
      <span class="text-sm text-muted mt-0-5"
        id="subDetailName" hidden
      ></span>
    </div>
    <div class="bucket-actions">
      <button
        class="btn btn-outline"
        id="subBackBtn"
        data-click="loadIdentities" hidden
      >
        &larr; Back
      </button>
      <span class="tooltip-wrapper" id="subRefreshWrapper">
        <button class="btn btn-outline" data-click="loadIdentities">
          Refresh
        </button>
        <span class="tooltip tooltip-right">Reload identities</span>
      </span>
    </div>
  </section>

  <!-- Bulk action bar (visible when rows are selected) -->
  <div class="bulk-bar" id="subBulkBar" hidden>
    <span class="text-muted" id="subBulkCount">0 selected</span>
    <button
      class="btn btn-outline btn-sm"
      data-click="openSubExportModal"
    >
      Export
    </button>
    <button
      class="btn btn-outline btn-sm ml-auto"
      data-click="clearSubSelection"
    >
      Clear
    </button>
  </div>

  <div class="table-wrapper">
    <div class="scroll-area">
      <table>
        <thead>
          <tr id="subscriptionsTableHead">
            <th class="col-select">
              <label class="row-check" title="Select all"
                ><input
                  type="checkbox"
                  id="subSelectAll"
                  data-change="toggleSubSelectAll $checked"
              /></label>
            </th>
            <th>Email</th>
            <th>Name</th>
            <th>Buckets</th>
            <th>Created</th>
            <th>Updated</th>
            <th class="col-actions"></th>
          </tr>
        </thead>
        <tbody id="subscriptionsBody"></tbody>
      </table>
    </div>
    <div class="pagination-container">
      <div class="pagination-settings">
        <div class="page-size-selector">
          <span>Show</span>
          <select
            class="page-size-input"
            id="subPageSize"
            data-change="updateSubPageSize"
          >
            <option value="10" selected>10</option>
            <option value="25">25</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
          <span>per page</span>
        </div>
        <div class="pagination-info" id="subPaginationInfo"></div>
      </div>
      <div class="flex gap-2">
        <button
          class="btn btn-outline"
          id="subPrevBtn"
          data-click="changeSubPage -1"
        >
          Previous
        </button>
        <button
          class="btn btn-outline"
          id="subNextBtn"
          data-click="changeSubPage 1"
        >
          Next
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Subscriber Export Modal -->
<dialog
  class="modal-backdrop"
  id="subExportModal"
  aria-labelledby="subExportModalTitle"
  data-self
  data-click="closeSubExportModal"
>
  <div class="modal">
    <div class="modal-header">
      <h3 id="subExportModalTitle" class="select-none">Export subscribers</h3>
      <button
        class="btn btn-icon"
        data-click="closeSubExportModal"
        aria-label="Close"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>
    <p>
      Export <strong id="subExportCount">0</strong> subscriber(s). Each row
      includes email, Beacon ID, list count, created date, and last updated.
    </p>
    <div class="form-group">
      <label for="subExportFormat">Format</label>
      <select id="subExportFormat">
        <option value="csv">CSV</option>
        <option value="json">JSON</option>
        <option value="yaml">YAML</option>
        <option value="xml">XML</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" data-click="closeSubExportModal">
        Cancel
      </button>
      <button
        class="btn btn-primary"
        id="subExportConfirmBtn"
        data-click="confirmSubExport"
      >
        Export
      </button>
    </div>
  </div>
</dialog>
