<!-- Audit View -->
<div id="view-audit" class="view">
  <section class="header-container">
    <div>
      <h1 class="select-none">Audit</h1>
      <span class="status-badge select-none">Consent history</span>
    </div>
    <div class="bucket-actions">
      <button class="btn btn-outline" data-click="loadAudit">Refresh</button>
    </div>
  </section>
  <div class="table-wrapper">
    <div class="scroll-area">
      <table>
        <thead>
          <tr id="auditTableHead">
            <th>Timestamp</th>
            <th>Email or ID</th>
            <th>Bucket</th>
            <th>Permission</th>
            <th>Change</th>
            <th>Source</th>
            <th>Actor</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="auditBody"></tbody>
      </table>
    </div>
    <div class="pagination-container" id="auditPager"></div>
  </div>
</div>
