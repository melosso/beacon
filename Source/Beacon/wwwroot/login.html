<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link href="/css/site.css" rel="stylesheet" />
    <script src="/js/theme.js"></script>
    <title>Sign In &middot; Beacon</title>
  </head>
  <body>
    <div
      class="toast-container"
      id="toastContainer"
      role="status"
      aria-live="polite"
    ></div>

    <!-- LOGIN_PROMO_BAR_PLACEHOLDER -->

    <div class="auth-overlay" id="loginOverlay" style="display: none">
      <div style="display: flex; flex-direction: column; align-items: center">
        <div
          style="
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
          "
        >
          <div class="brand-avatar" style="width: 28px; height: 28px">
            <svg
              viewBox="0 0 20 20"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              class="brand-avatar-bg"
              aria-hidden="true"
            >
              <g clip-path="url(#beacon-avatar-clip)">
                <rect width="20" height="20" fill="#000" rx="5.5" />
                <rect
                  width="20"
                  height="20"
                  fill="url(#beacon-avatar-gradient)"
                  fill-opacity="0.2"
                  rx="5.5"
                />
                <g filter="url(#beacon-avatar-blur-1)" opacity="0.3">
                  <circle
                    cx="16"
                    cy="17"
                    r="6"
                    fill="#FF64B4"
                    fill-opacity="0.671"
                  />
                </g>
                <g filter="url(#beacon-avatar-blur-2)" opacity="0.1">
                  <circle
                    cx="16"
                    cy="16"
                    r="6"
                    fill="#FF64B4"
                    fill-opacity="0.671"
                  />
                </g>
                <g filter="url(#beacon-avatar-blur-3)" opacity="0.4">
                  <circle
                    cx="17"
                    cy="19"
                    r="6"
                    fill="#FF64B4"
                    fill-opacity="0.671"
                  />
                </g>
                <rect
                  width="20"
                  height="20"
                  fill="#FF64B4"
                  fill-opacity="0.15"
                  rx="5.5"
                />
                <g style="mix-blend-mode: hard-light">
                  <rect
                    width="20"
                    height="20"
                    fill="#6A62FF"
                    fill-opacity="0.1"
                    rx="5.5"
                  />
                </g>
              </g>
              <rect
                width="19"
                height="19"
                x="0.5"
                y="0.5"
                stroke="#FDFDFD"
                stroke-opacity="0.1"
                rx="5"
              />
              <defs>
                <filter
                  id="beacon-avatar-blur-1"
                  width="32"
                  height="32"
                  x="0"
                  y="1"
                  color-interpolation-filters="sRGB"
                  filterUnits="userSpaceOnUse"
                >
                  <feFlood flood-opacity="0" result="BackgroundImageFix" />
                  <feBlend
                    in="SourceGraphic"
                    in2="BackgroundImageFix"
                    result="shape"
                  />
                  <feGaussianBlur
                    result="effect1_foregroundBlur"
                    stdDeviation="5"
                  />
                </filter>
                <filter
                  id="beacon-avatar-blur-2"
                  width="22"
                  height="22"
                  x="5"
                  y="5"
                  color-interpolation-filters="sRGB"
                  filterUnits="userSpaceOnUse"
                >
                  <feFlood flood-opacity="0" result="BackgroundImageFix" />
                  <feBlend
                    in="SourceGraphic"
                    in2="BackgroundImageFix"
                    result="shape"
                  />
                  <feGaussianBlur
                    result="effect1_foregroundBlur"
                    stdDeviation="5"
                  />
                </filter>
                <filter
                  id="beacon-avatar-blur-3"
                  width="28"
                  height="28"
                  x="3"
                  y="5"
                  color-interpolation-filters="sRGB"
                  filterUnits="userSpaceOnUse"
                >
                  <feFlood flood-opacity="0" result="BackgroundImageFix" />
                  <feBlend
                    in="SourceGraphic"
                    in2="BackgroundImageFix"
                    result="shape"
                  />
                  <feGaussianBlur
                    result="effect1_foregroundBlur"
                    stdDeviation="5"
                  />
                </filter>
                <linearGradient
                  id="beacon-avatar-gradient"
                  x1="10"
                  y1="0"
                  x2="10"
                  y2="20"
                  gradientUnits="userSpaceOnUse"
                >
                  <stop stop-color="#FF64B4" />
                  <stop offset="1" stop-color="#6A62FF" stop-opacity="0" />
                </linearGradient>
                <clipPath id="beacon-avatar-clip">
                  <rect width="20" height="20" rx="5.5" />
                </clipPath>
              </defs>
            </svg>
            <svg
              class="brand-avatar-icon"
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#FDFDFD"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"
              />
            </svg>
          </div>
          <h1
            class="select-none"
            style="font-size: 1.1rem; font-weight: 500; margin: 0"
          >
            Beacon
          </h1>
        </div>
        <div class="auth-box select-none">
          <h2 id="loginHeading">Sign in to Beacon</h2>
          <p id="authOverlayDesc">
            Enter your API key to access the admin panel.
          </p>
          <input
            type="text"
            id="usernameInput"
            placeholder="Username"
            aria-label="Username"
            autocomplete="username"
            style="display: none"
            data-enter="authenticate"
          />
          <input
            type="password"
            id="apiKeyInput"
            placeholder="API Key"
            aria-label="API Key"
            autocomplete="current-password"
            data-enter="authenticate"
          />
          <div class="error" id="authError">Invalid credentials</div>
          <button
            class="btn btn-primary"
            id="signInBtn"
            style="width: 100%; justify-content: center"
            data-click="authenticate"
          >
            <span class="btn-label"
              ><svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                style="vertical-align: middle; margin-right: 0.4rem"
              >
                <path d="m10 17 5-5-5-5" />
                <path d="M15 12H3" />
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" /></svg
              >Sign In</span
            ><span class="spinner"></span>
          </button>
          <div
            id="authToggleSep"
            style="
              display: none;
              align-items: center;
              gap: 0.5rem;
              margin: 1rem 0 0;
            "
          >
            <span
              style="flex: 1; height: 1px; background: hsl(var(--border))"
            ></span>
            <span
              style="
                font-size: 0.7rem;
                color: hsl(var(--muted-foreground));
                text-transform: uppercase;
                letter-spacing: 0.08em;
                white-space: nowrap;
              "
              >Or continue with</span
            >
            <span
              style="flex: 1; height: 1px; background: hsl(var(--border))"
            ></span>
          </div>
          <div id="authToggleBtn" style="display: none; margin-top: 0.75rem">
            <button
              class="btn btn-outline"
              style="width: 100%; justify-content: center; font-family: inherit"
              data-click="toggleAuthMode"
            ></button>
          </div>
        </div>
        <div class="auth-footer"><!-- LOGIN_FOOTER_PLACEHOLDER --></div>
      </div>
    </div>

    <script src="/admin/config.js" defer></script>
    <script type="module" src="/js/lit.js"></script>
    <script src="/js/base.js" defer></script>
  </body>
</html>
