<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="32x32" />
    <link href="/css/site.css" rel="stylesheet" />
    <script src="/js/theme.js"></script>
    <title>Sign in &middot; Beacon</title>
  </head>
  <body>
    <!-- LOGIN_PROMO_BAR_PLACEHOLDER -->

    <main class="auth-page" id="loginOverlay" hidden>
      <div class="auth-brand select-none">
        <div class="brand-avatar brand-avatar--lg">
            <svg
              viewBox="0 0 20 20"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              class="brand-avatar-bg"
              aria-hidden="true"
            >
              <g clip-path="url(#beacon-avatar-clip)">
                <rect width="20" height="20" fill="#000" rx="5.5" />
                <rect
                  width="20"
                  height="20"
                  fill="url(#beacon-avatar-gradient)"
                  fill-opacity="0.2"
                  rx="5.5"
                />
                <g filter="url(#beacon-avatar-blur-1)" opacity="0.3">
                  <circle
                    cx="16"
                    cy="17"
                    r="6"
                    fill="#FF64B4"
                    fill-opacity="0.671"
                  />
                </g>
                <g filter="url(#beacon-avatar-blur-2)" opacity="0.1">
                  <circle
                    cx="16"
                    cy="16"
                    r="6"
                    fill="#FF64B4"
                    fill-opacity="0.671"
                  />
                </g>
                <g filter="url(#beacon-avatar-blur-3)" opacity="0.4">
                  <circle
                    cx="17"
                    cy="19"
                    r="6"
                    fill="#FF64B4"
                    fill-opacity="0.671"
                  />
                </g>
                <rect
                  width="20"
                  height="20"
                  fill="#FF64B4"
                  fill-opacity="0.15"
                  rx="5.5"
                />
                <g class="blend-hard-light">
                  <rect
                    width="20"
                    height="20"
                    fill="#6A62FF"
                    fill-opacity="0.1"
                    rx="5.5"
                  />
                </g>
              </g>
              <rect
                width="19"
                height="19"
                x="0.5"
                y="0.5"
                stroke="#FDFDFD"
                stroke-opacity="0.1"
                rx="5"
              />
              <defs>
                <filter
                  id="beacon-avatar-blur-1"
                  width="32"
                  height="32"
                  x="0"
                  y="1"
                  color-interpolation-filters="sRGB"
                  filterUnits="userSpaceOnUse"
                >
                  <feFlood flood-opacity="0" result="BackgroundImageFix" />
                  <feBlend
                    in="SourceGraphic"
                    in2="BackgroundImageFix"
                    result="shape"
                  />
                  <feGaussianBlur
                    result="effect1_foregroundBlur"
                    stdDeviation="5"
                  />
                </filter>
                <filter
                  id="beacon-avatar-blur-2"
                  width="22"
                  height="22"
                  x="5"
                  y="5"
                  color-interpolation-filters="sRGB"
                  filterUnits="userSpaceOnUse"
                >
                  <feFlood flood-opacity="0" result="BackgroundImageFix" />
                  <feBlend
                    in="SourceGraphic"
                    in2="BackgroundImageFix"
                    result="shape"
                  />
                  <feGaussianBlur
                    result="effect1_foregroundBlur"
                    stdDeviation="5"
                  />
                </filter>
                <filter
                  id="beacon-avatar-blur-3"
                  width="28"
                  height="28"
                  x="3"
                  y="5"
                  color-interpolation-filters="sRGB"
                  filterUnits="userSpaceOnUse"
                >
                  <feFlood flood-opacity="0" result="BackgroundImageFix" />
                  <feBlend
                    in="SourceGraphic"
                    in2="BackgroundImageFix"
                    result="shape"
                  />
                  <feGaussianBlur
                    result="effect1_foregroundBlur"
                    stdDeviation="5"
                  />
                </filter>
                <linearGradient
                  id="beacon-avatar-gradient"
                  x1="10"
                  y1="0"
                  x2="10"
                  y2="20"
                  gradientUnits="userSpaceOnUse"
                >
                  <stop stop-color="#FF64B4" />
                  <stop offset="1" stop-color="#6A62FF" stop-opacity="0" />
                </linearGradient>
                <clipPath id="beacon-avatar-clip">
                  <rect width="20" height="20" rx="5.5" />
                </clipPath>
              </defs>
            </svg>
            <svg
              class="brand-avatar-icon"
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#FDFDFD"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"
              />
            </svg>
          </div>
        <span class="auth-brand-name">Beacon</span>
      </div>
      <form class="auth-box" id="authForm" data-submit="authenticate">
        <h1 id="loginHeading">Sign in to Beacon</h1>
        <p id="authOverlayDesc">Enter your API key to sign in.</p>
        <div class="form-group" id="usernameGroup" hidden>
          <label for="usernameInput">Username</label>
          <input
            type="text"
            id="usernameInput"
            autocomplete="username"
            required
            disabled
          />
        </div>
        <div class="form-group">
          <label for="apiKeyInput" id="apiKeyLabel">API key</label>
          <input
            type="password"
            id="apiKeyInput"
            autocomplete="current-password"
            placeholder="*****"
            required
          />
        </div>
        <p class="auth-error" id="authError" role="alert" hidden></p>
        <button type="submit" class="btn btn-primary btn-block" id="signInBtn">
          <span class="btn-label">Sign in</span><span class="spinner"></span>
        </button>
        <div class="auth-divider" id="authToggleSep" hidden>Or</div>
        <button
          type="button"
          class="btn btn-outline btn-block"
          id="authToggleBtn"
          data-click="toggleAuthMode"
          hidden
        ></button>
      </form>
      <div class="auth-footer"><!-- LOGIN_FOOTER_PLACEHOLDER --></div>
    </main>

    <script src="/admin/config.js" defer></script>
    <script type="module" src="/js/lit.js"></script>
    <script src="/js/base.js" defer></script>
  </body>
</html>
