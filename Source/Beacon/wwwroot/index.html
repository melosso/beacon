<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>421: MISDIRECTED_REQUEST</title>
  <meta name="color-scheme" content="light dark" />
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --accent: #2563eb;
      --success: #22c55e;
      --warning: #f59e0b;
      --error: #ef4444;
      --info: #3b82f6;
      --radius: 14px;
      --max-width: 520px;
      --code-bg: color-mix(in srgb, var(--fg) 5%, transparent);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f0f;
        --fg: #e7e7e7;
        --accent: #7aa2ff;
      }
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: var(--max-width);
      border: 1px solid color-mix(in srgb, var(--fg) 15%, transparent);
      border-radius: var(--radius);
      padding: 28px;
    }

    .error-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid color-mix(in srgb, var(--fg) 10%, transparent);
    }

    .status-code {
      font-size: 1.5rem;
      font-weight: 700;
      padding-right: 16px;
      border-right: 2px solid var(--error);
    }

    h1 {
      font-size: 1.2rem;
      margin: 0;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-transform: uppercase;
    }

    .dev-info {
      background: var(--code-bg);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .dev-line {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.85rem;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .dev-line:last-child { margin-bottom: 0; }

    .label {
      color: color-mix(in srgb, var(--fg) 50%, transparent);
    }

    .value {
      font-weight: 500;
    }

    .note {
      display: block;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--accent);
      font-size: 0.9rem;
      line-height: 1.4;
      color: var(--accent);
      text-decoration: none;
      transition: background 0.2s ease;
    }

    .note:hover {
      background: color-mix(in srgb, var(--accent) 5%, transparent);
    }

    .footer {
      margin-top: 24px;
      text-align: center;
    }

    .back-link {
      color: color-mix(in srgb, var(--fg) 60%, transparent);
      text-decoration: none;
      font-size: 0.9rem;
    }

    .back-link:hover {
      color: var(--fg);
      text-decoration: underline;
    }
    
    .select-none {
      user-select: none;
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <div class="error-header select-none">
        <span class="status-code">421</span>
        <h1>Misdirected Request</h1>
      </div>

      <p class="select-none">The server was not able to produce a response.</p>

      <div class="dev-info">
        <div class="dev-line">
          <span class="label select-none">Code:</span>
          <span class="value"><code>MISDIRECTED_REQUEST</code></span>
        </div>
        <div class="dev-line">
          <span class="label select-none">Timestamp:</span>
          <span class="value"><code id="ts">Loading...</code></span>
        </div>
      </div>

      <p class="select-none">Didn't expect this? Please let us know.</p>

      <div class="footer">
        <a href="javascript:history.back()" class="back-link select-none">Go Back</a>
      </div>
    </section>
  </main>

  <script>
    document.getElementById('ts').textContent = new Date().toISOString();
  </script>
</body>
</html>
