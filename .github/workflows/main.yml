name: Build and Push As Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.0.0)'
        required: true
        type: string

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_PATH: 'Source/Beacon.sln'
  PROJECT_PATH: 'Source/Beacon/Beacon.csproj'
  SOURCE_DIR: 'Source/Beacon'
  BUILD_OUTPUT: 'build-output'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ github.event.inputs.tag_name }}" -m "Release ${{ github.event.inputs.tag_name }}"
          git push origin "${{ github.event.inputs.tag_name }}"

      - name: Restore and build
        run: |
          dotnet restore ${{ env.SOLUTION_PATH }}
          dotnet build ${{ env.SOLUTION_PATH }} -c Release --no-restore

      - name: Publish application
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            -c Release \
            -r win-x64 \
            --self-contained false \
            -p:PublishSingleFile=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o ${{ env.BUILD_OUTPUT }}

      - name: Create deployment structure
        run: |
          cd ${{ env.BUILD_OUTPUT }}

          # Create required folders
          mkdir -p log .core license

          # Remove unnecessary files
          rm -f *.pdb *.xml *.deps.json web.config *.Development.json \
                *.staticwebassets.endpoints.json

          # Copy deployment files from repo
          cp ../Deployment/Beacon.bat .
          cp ../Deployment/README.txt .

          # Copy license
          cp ../LICENSE license/LICENSE.txt || true

          # Create source reference
          echo "https://github.com/${{ github.repository }}" > license/source.txt

      - name: Create version file
        run: |
          echo "${{ github.event.inputs.tag_name }}" > ${{ env.BUILD_OUTPUT }}/.version.txt
          echo "Built: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> ${{ env.BUILD_OUTPUT }}/.version.txt
          echo "Commit: ${{ github.sha }}" >> ${{ env.BUILD_OUTPUT }}/.version.txt

      - name: Create deployment archive
        run: |
          cd ${{ env.BUILD_OUTPUT }}
          zip -r ../Beacon-${{ github.event.inputs.tag_name }}-win-x64.zip .
          cd ..
          sha256sum Beacon-${{ github.event.inputs.tag_name }}-win-x64.zip > \
            Beacon-${{ github.event.inputs.tag_name }}-win-x64.zip.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ${{ github.event.inputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            Beacon-${{ github.event.inputs.tag_name }}-win-x64.zip
            Beacon-${{ github.event.inputs.tag_name }}-win-x64.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beacon-${{ github.event.inputs.tag_name }}
          path: Beacon-${{ github.event.inputs.tag_name }}-win-x64.zip
          retention-days: 90
