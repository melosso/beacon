version: 2
updates:
  # Central package management: Directory.Packages.props and Beacon.slnx are in Source/.
  - package-ecosystem: "nuget"
    directory: "/Source"
    schedule:
      interval: "weekly"
    groups:
      ef-core:
        patterns: ["Microsoft.EntityFrameworkCore*", "Microsoft.Extensions.*"]
      testing:
        patterns: ["xunit*", "Testcontainers*", "Microsoft.Testing.*"]
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
